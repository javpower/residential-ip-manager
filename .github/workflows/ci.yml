name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go cross-platform
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true

      - name: Check formatting
        run: |
          files=$(find cmd internal -type f -name '*.go')
          test -z "$(gofmt -l $files)"

      - name: Vet
        run: |
          go vet ./...
          (cd third_party/minivpn && go vet ./...)

      - name: Test
        run: |
          go test ./...
          (cd third_party/minivpn && go test ./...)

      - name: Vulnerability scan
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
          (cd third_party/minivpn && go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...)

      - name: Cross-platform build
        env:
          OUT_DIR: dist/go
          VERSION: ci
        run: sh scripts/build_go.sh
